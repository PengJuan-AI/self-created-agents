<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drafter</title>
    <style>
      :root {
        color: #1f2937;
        background: #f7f8fa;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }

      main {
        width: min(720px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      header { margin-bottom: 36px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 28px; font-weight: 650; }
      header p { color: #64748b; margin-top: 6px; }

      .section-label {
        display: block;
        color: #334155;
        font-size: 14px;
        font-weight: 650;
        margin-bottom: 10px;
      }

      textarea, #response {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #ffffff;
        font: inherit;
        line-height: 1.55;
      }

      textarea {
        min-height: 132px;
        padding: 12px;
        resize: vertical;
      }

      textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px #dbeafe;
        outline: 0;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 52px;
      }

      #status { color: #64748b; font-size: 13px; }

      button {
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 9px 16px;
      }

      button:hover { background: #1d4ed8; }
      button:disabled { cursor: wait; opacity: 0.65; }

      .response-section { margin-top: 24px; }

      #response {
        min-height: 180px;
        padding: 16px;
        white-space: pre-wrap;
      }

      #response[data-state="idle"] { color: #64748b; }
      #response[data-state="error"] { color: #b91c1c; }

      @media (max-width: 520px) {
        main { padding: 32px 0; }
        .actions { align-items: flex-start; flex-direction: column-reverse; padding-top: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Drafter</h1>
        <p>Draft and revise documents with an AI writing assistant.</p>
      </header>

      <form id="draft-form">
        <label class="section-label" for="message">User input</label>
        <textarea id="message" name="message" placeholder="Describe what you want to write or revise." required></textarea>
        <div class="actions">
          <span id="status" aria-live="polite"></span>
          <button id="send-button" type="submit">Send</button>
        </div>
      </form>

      <section class="response-section" aria-labelledby="response-label">
        <h2 id="response-label" class="section-label">Agent response</h2>
        <div id="response" data-state="idle" aria-live="polite">Your draft will appear here.</div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#draft-form");
      const message = document.querySelector("#message");
      const response = document.querySelector("#response");
      const status = document.querySelector("#status");
      const sendButton = document.querySelector("#send-button");
      const sessionKey = "drafter-session-id";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const prompt = message.value.trim();
        if (!prompt) return;

        sendButton.disabled = true;
        status.textContent = "Writing...";
        response.dataset.state = "idle";
        response.textContent = "Drafter is working on your request.";

        try {
          const reply = await fetch("/api/draft", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: prompt,
              session_id: localStorage.getItem(sessionKey),
            }),
          });
          const payload = await reply.json();
          if (!reply.ok) throw new Error(payload.error || "Unable to reach Drafter.");

          localStorage.setItem(sessionKey, payload.session_id);
          response.dataset.state = "complete";
          response.textContent = payload.response;
          status.textContent = "";
          message.value = "";
          message.focus();
        } catch (error) {
          response.dataset.state = "error";
          response.textContent = error.message || "Unable to reach Drafter.";
          status.textContent = "";
        } finally {
          sendButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
